title: PID Controller Dashboard
views:
  - title: Overview
    path: overview
    icon: mdi:thermostat
    cards:
      - type: markdown
        content: |
          # PID Controller Overview
          **How it works**: Custom PID computes valve % from error (target - current). Floor value keeps valve slightly open for comfort. Boost opens valve fully on large setpoint changes.

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: climate.lr_thermostat_window_custom_pid
            attribute: valve_position
            name: LR Window
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 50
              red: 80
            needle: true
          - type: gauge
            entity: climate.lr_thermostat_balcony_custom_pid
            attribute: valve_position
            name: LR Balcony
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 50
              red: 80
            needle: true
          - type: gauge
            entity: climate.br_thermostat_custom_pid
            attribute: valve_position
            name: Bedroom
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 50
              red: 80
            needle: true
          - type: gauge
            entity: climate.jb_thermostat_custom_pid
            attribute: valve_position
            name: Jacob's Room
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 50
              red: 80
            needle: true

      - type: entities
        title: All Thermostats Status
        entities:
          - type: section
            label: Living Room - Window
          - entity: climate.lr_thermostat_window_custom_pid
            name: Virtual Thermostat
          - entity: number.lr_thermostat_window_pi_heating_demand
            name: Valve (PI Heating Demand)
          - type: section
            label: Living Room - Balcony
          - entity: climate.lr_thermostat_balcony_custom_pid
            name: Virtual Thermostat
          - entity: number.lr_thermostat_balcony_pi_heating_demand
            name: Valve (PI Heating Demand)
          - type: section
            label: Bedroom
          - entity: climate.br_thermostat_custom_pid
            name: Virtual Thermostat
          - entity: number.br_thermostat_pi_heating_demand
            name: Valve (PI Heating Demand)
          - type: section
            label: Jacob's Room
          - entity: climate.jb_thermostat_custom_pid
            name: Virtual Thermostat
          - entity: number.jb_thermostat_pi_heating_demand
            name: Valve (PI Heating Demand)

  - title: PID Breakdown
    path: pid-breakdown
    icon: mdi:chart-box
    cards:
      # --- Living Room - Window ---
      - type: markdown
        title: Living Room - Window
        content: |
          {% set e = 'climate.lr_thermostat_window_custom_pid' %}
          {% set pid = state_attr(e, 'pid_p') %}
          {% set pii = state_attr(e, 'pid_i') %}
          {% set pid_d = state_attr(e, 'pid_d') %}
          {% set kp = state_attr(e, 'kp') %}
          {% set current = state_attr(e, 'current_temperature') %}
          {% set target = state_attr(e, 'temperature') %}
          {% set valve = state_attr(e, 'valve_position') %}
          {% set floor = state_attr(e, 'floor_value') %}
          {% set floor_active = state_attr(e, 'floor_active') %}
          {% set boost_active = state_attr(e, 'boost_active') %}
          {% set off_threshold = state_attr(e, 'off_threshold') %}
          {% set hvac_mode = states(e) %}
          {% set error = (target - current) | round(2) if current and target else 'N/A' %}
          {% set raw = (pid + pii + pid_d) | round(2) if pid is not none else 'N/A' %}
          {% if hvac_mode == 'off' %}
          | | Value |
          |:--|--:|
          | **Current temp** | {{ current }}°C |
          | **Target temp** | {{ target }}°C |
          | **Valve position** | **0%** |
          > **HVAC OFF** — Thermostat turned off (e.g., window open). Valve closed, PID inactive.
          {% else %}
          | | Value |
          |:--|--:|
          | **Current temp** | {{ current }}°C |
          | **Target temp** | {{ target }}°C |
          | **Error** (target - current) | {{ error }}°C |
          | | |
          | **P** = Kp × error = {{ kp }} × {{ error }} | **{{ pid }}** |
          | **I** = accumulated | **{{ pii }}** |
          | **D** = Kd × rate | **{{ pid_d }}** |
          | **Raw PID output** (P + I + D) | **{{ raw }}%** |
          | | |
          | **Valve position** | **{{ valve }}%** |
          | **Floor active** | {{ '🟢 Yes' if floor_active else '⚪ No' }} |
          | **Boost active** | {{ '🔴 Yes' if boost_active else '⚪ No' }} |
          {% if boost_active %}
          > **BOOST**: Error ≥ {{ state_attr(e, 'boost_threshold') }}°C → valve forced to {{ state_attr(e, 'boost_value') }}%
          {% elif floor_active %}
          {% if current and target and current > target %}
          {% set overshoot = ((current - target) / off_threshold) | round(2) %}
          > **FLOOR DECAY**: {{ current }}°C is {{ (current - target) | round(2) }}°C above target. Effective floor = {{ floor }}% × (1 - {{ overshoot }}) = **{{ (floor * (1 - overshoot)) | round(0) | int }}%**
          {% else %}
          > **FLOOR**: Raw output {{ raw }}% < floor {{ floor }}% → valve held at {{ floor }}%
          {% endif %}
          {% elif current and target and current >= target + off_threshold %}
          > **OFF**: {{ current }}°C ≥ {{ target }}°C + {{ off_threshold }}°C → valve closed, integral reset
          {% else %}
          > PID output used directly: **{{ valve }}%**
          {% endif %}
          {% endif %}

