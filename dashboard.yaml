  - title: Living Room - Window
    path: lr-window
    icon: mdi:radiator
    cards:
      - type: markdown
        content: |
          ## Living Room - Window

      - type: thermostat
        entity: climate.lr_thermostat_window_custom_pid

      - type: history-graph
        title: Temperature & Valve History
        hours_to_show: 24
        entities:
          - entity: climate.lr_thermostat_window_custom_pid
            name: Temperature
          - entity: number.lr_thermostat_window_pi_heating_demand
            name: Valve %

      - type: entities
        title: Settings
        entities:
          - type: attribute
            entity: climate.lr_thermostat_window_custom_pid
            attribute: kp
            name: Kp (Proportional gain)
            icon: mdi:alpha-p-circle
          - type: attribute
            entity: climate.lr_thermostat_window_custom_pid
            attribute: ki
            name: Ki (Integral gain)
            icon: mdi:alpha-i-circle
          - type: attribute
            entity: climate.lr_thermostat_window_custom_pid
            attribute: kd
            name: Kd (Derivative gain)
            icon: mdi:alpha-d-circle
          - type: attribute
            entity: climate.lr_thermostat_window_custom_pid
            attribute: floor_value
            name: Floor value (%)
            icon: mdi:arrow-collapse-down
          - type: attribute
            entity: climate.lr_thermostat_window_custom_pid
            attribute: off_threshold
            name: Off threshold (°C)
            icon: mdi:thermometer-off
          - type: attribute
            entity: climate.lr_thermostat_window_custom_pid
            attribute: boost_threshold
            name: Boost threshold (°C)
            icon: mdi:rocket-launch
          - type: attribute
            entity: climate.lr_thermostat_window_custom_pid
            attribute: boost_value
            name: Boost value (%)
            icon: mdi:rocket-launch
          - type: attribute
            entity: climate.lr_thermostat_window_custom_pid
            attribute: integral_max
            name: Integral anti-windup limit
            icon: mdi:arrow-collapse-vertical
          - type: attribute
            entity: climate.lr_thermostat_window_custom_pid
            attribute: update_interval_min
            name: Valve refresh (min)
            icon: mdi:timer-refresh
          - type: attribute
            entity: climate.lr_thermostat_window_custom_pid
            attribute: pid_sample_interval_sec
            name: PID interval (sec)
            icon: mdi:timer-cog
          - type: attribute
            entity: climate.lr_thermostat_window_custom_pid
            attribute: sync_target_temperature
            name: Sync target to real thermostat
            icon: mdi:sync

